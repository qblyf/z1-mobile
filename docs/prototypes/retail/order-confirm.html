<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>订单确认</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .glass { background: rgba(255,255,255,0.88); backdrop-filter: blur(20px); }
    .card { background: white; border-radius: 14px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .btn-primary { background: linear-gradient(135deg,#3b82f6,#2563eb); border-radius: 14px; color: white; font-weight: 600; }
    .coupon-tag { background: linear-gradient(135deg,#fef3c7,#fde68a); color: #92400e; }
    .coin-tag { background: linear-gradient(135deg,#eff6ff,#dbeafe); color: #1d4ed8; }
    .detail-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #f3f4f6; }
    .arrow { width: 20px; height: 20px; border-radius: 50%; background: #f3f4f6; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
    .arrow:active { background: #e5e7eb; }
  </style>
</head>
<body class="bg-gray-50 pb-28">

  <!-- 顶部导航 -->
  <div class="glass fixed top-0 left-0 right-0 z-50 px-4 py-3 flex items-center justify-between">
    <button class="p-2 -ml-2 rounded-full active:bg-gray-100" onclick="history.back()">
      <svg class="w-6 h-6 text-gray-700" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
    </button>
    <span class="text-base font-semibold text-gray-800">确认订单</span>
    <div class="w-10"></div>
  </div>

  <div class="pt-16 px-4 space-y-4">

    <!-- 会员信息 -->
    <div class="card p-4 flex items-center gap-3">
      <div class="w-10 h-10 rounded-full bg-blue-100 flex items-center justify-center text-blue-600 font-semibold">张</div>
      <div class="flex-1">
        <div class="text-sm font-semibold text-gray-800">张三</div>
        <div class="text-xs text-gray-500">金卡会员 · 积分 28,888</div>
      </div>
      <span class="text-xs text-gray-400">已绑定</span>
    </div>

    <!-- 订单摘要 -->
    <div class="card overflow-hidden">
      <div class="px-4 py-3 border-b border-gray-100 flex items-center justify-between cursor-pointer" onclick="toggleItems()">
        <div class="flex items-center gap-2">
          <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
          <span class="text-sm font-medium text-gray-700">商品清单（3件）</span>
        </div>
        <div class="flex items-center gap-1">
          <span class="text-xs text-gray-400">查看详情</span>
          <svg id="arrowDown" class="w-4 h-4 text-gray-300 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
        </div>
      </div>
      <div id="itemList" class="hidden px-4 py-2">
        <div class="flex gap-3 py-3 border-b border-gray-50">
          <div class="w-12 h-12 rounded-xl bg-gray-100 flex items-center justify-center text-2xl flex-shrink-0">📿</div>
          <div class="flex-1 min-w-0">
            <div class="text-sm font-medium text-gray-800 truncate">足金凤尾纹手镯 30g</div>
            <div class="text-xs text-gray-400">×1</div>
          </div>
          <div class="text-sm font-semibold text-gray-800">¥2,800</div>
        </div>
        <div class="flex gap-3 py-3 border-b border-gray-50">
          <div class="w-12 h-12 rounded-xl bg-gray-100 flex items-center justify-center text-2xl flex-shrink-0">💎</div>
          <div class="flex-1 min-w-0">
            <div class="text-sm font-medium text-gray-800 truncate">50分钻戒 D色 VS1</div>
            <div class="text-xs text-gray-400">×1</div>
          </div>
          <div class="text-sm font-semibold text-gray-800">¥18,500</div>
        </div>
        <div class="flex gap-3 py-3">
          <div class="w-12 h-12 rounded-xl bg-gray-100 flex items-center justify-center text-2xl flex-shrink-0">📿</div>
          <div class="flex-1 min-w-0">
            <div class="text-sm font-medium text-gray-800 truncate">S925 满天星项链</div>
            <div class="text-xs text-gray-400">×1</div>
          </div>
          <div class="text-sm font-semibold text-gray-800">¥228</div>
        </div>
      </div>
      <div class="px-4 py-3 flex justify-between items-center">
        <span class="text-sm text-gray-500">商品小计</span>
        <span class="text-sm font-semibold text-gray-800">¥21,528</span>
      </div>
    </div>

    <!-- 优惠应用 -->
    <div class="card divide-y divide-gray-50">
      <div class="px-4 py-3.5 flex items-center justify-between cursor-pointer active:bg-gray-50" onclick="selectCoupon()">
        <div class="flex items-center gap-3">
          <span class="text-base">🎫</span>
          <div>
            <div class="text-sm font-medium text-gray-800">优惠券</div>
            <div class="text-xs text-gray-400">1张可用</div>
          </div>
        </div>
        <div class="flex items-center gap-2">
          <span class="text-sm font-semibold text-red-500">-¥120</span>
          <div class="arrow"><svg class="w-3 h-3 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg></div>
        </div>
      </div>
      <div class="px-4 py-3.5 flex items-center justify-between cursor-pointer active:bg-gray-50" onclick="useCoins()">
        <div class="flex items-center gap-3">
          <span class="text-base">💰</span>
          <div>
            <div class="text-sm font-medium text-gray-800">积分抵扣</div>
            <div class="text-xs text-gray-400">可用积分 28,888，可抵 ¥288.88</div>
          </div>
        </div>
        <div class="flex items-center gap-2">
          <span class="text-sm font-semibold text-blue-600">-¥0</span>
          <div class="arrow"><svg class="w-3 h-3 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg></div>
        </div>
      </div>
      <div class="px-4 py-3.5 flex items-center justify-between cursor-pointer active:bg-gray-50">
        <div class="flex items-center gap-3">
          <span class="text-base">🎟️</span>
          <div>
            <div class="text-sm font-medium text-gray-800">代金券</div>
            <div class="text-xs text-gray-400">已自动抵用 ¥30</div>
          </div>
        </div>
        <div class="flex items-center gap-2">
          <span class="text-sm font-semibold text-green-600">-¥30</span>
          <div class="arrow"><svg class="w-3 h-3 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg></div>
        </div>
      </div>
      <div class="px-4 py-3.5 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <span class="text-base">🎁</span>
          <div>
            <div class="text-sm font-medium text-gray-800">满赠赠品</div>
            <div class="text-xs text-gray-400">满¥20000，已满足</div>
          </div>
        </div>
        <span class="text-sm font-semibold text-gray-800">足金耳钉 ×1</span>
      </div>
    </div>

    <!-- 备注 -->
    <div class="card px-4 py-3.5">
      <div class="flex items-center gap-2 mb-2">
        <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
        <span class="text-sm text-gray-500">订单备注</span>
      </div>
      <input type="text" placeholder="选填，可添加订单备注（选填）" class="w-full text-sm text-gray-700 bg-transparent outline-none placeholder-gray-300">
    </div>

    <!-- 优惠汇总 -->
    <div class="card px-4 py-3.5 space-y-2">
      <div class="flex justify-between text-sm">
        <span class="text-gray-500">商品小计</span>
        <span class="text-gray-800">¥21,528</span>
      </div>
      <div class="flex justify-between text-sm">
        <span class="text-gray-500">优惠券</span>
        <span class="text-red-500">-¥120</span>
      </div>
      <div class="flex justify-between text-sm">
        <span class="text-gray-500">积分抵扣</span>
        <span class="text-blue-600">-¥0</span>
      </div>
      <div class="flex justify-between text-sm">
        <span class="text-gray-500">代金券</span>
        <span class="text-green-600">-¥30</span>
      </div>
      <div class="flex justify-between text-sm">
        <span class="text-gray-500">满赠赠品</span>
        <span class="text-gray-800">足金耳钉</span>
      </div>
    </div>

  </div>

  <!-- 底部固定 -->
  <div class="fixed bottom-0 left-0 right-0 p-4 bg-white/90 backdrop-blur-xl border-t border-gray-100">
    <div class="flex items-center justify-between mb-3">
      <span class="text-sm text-gray-500">应付金额</span>
      <span class="text-2xl font-bold text-red-500">¥21,378</span>
    </div>
    <button onclick="submitOrder()" class="btn-primary w-full py-4 text-base active:scale-[0.98] transition-transform">
      提交订单
    </button>
  </div>

  <script>
    function toggleItems() {
      const list = document.getElementById('itemList');
      const arrow = document.getElementById('arrowDown');
      list.classList.toggle('hidden');
      arrow.style.transform = list.classList.contains('hidden') ? '' : 'rotate(180deg)';
    }
    function selectCoupon() { alert('打开优惠券选择弹窗'); }
    function useCoins() { alert('打开积分使用弹窗'); }
    function submitOrder() { alert('提交订单成功，跳转支付页'); window.location.href = 'payment.html'; }
  </script>
</body>
</html>
