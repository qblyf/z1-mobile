<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>零售开单入口</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f2f3f7; }
    .glass { background: rgba(255,255,255,0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
    .card { background: white; border-radius: 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
    .type-card { border-radius: 16px; border: 2px solid #e5e7eb; transition: all 0.2s; }
    .type-card.selected { border-color: #3b82f6; background: #eff6ff; }
    .btn-primary { background: linear-gradient(135deg,#3b82f6,#2563eb); border-radius: 14px; color: white; font-weight: 600; transition: all 0.2s; }
    .btn-primary:active { transform: scale(0.97); opacity: 0.9; }
    .btn-scan { background: white; border-radius: 14px; border: 1.5px solid #e5e7eb; transition: all 0.2s; }
    .btn-scan:active { background: #f9fafb; transform: scale(0.97); }
    .input-field { border-radius: 12px; border: 1.5px solid #e5e7eb; transition: border-color 0.2s; }
    .input-field:focus { border-color: #3b82f6; outline: none; }
    .tag { display: inline-flex; align-items: center; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 500; }
    .tag-retail { background: linear-gradient(135deg,#dbeafe,#bfdbfe); color: #1d4ed8; }
    .tag-wholesale { background: linear-gradient(135deg,#dcfce7,#bbf7d0); color: #166534; }
    .tag-engineering { background: linear-gradient(135deg,#fef3c7,#fde68a); color: #92400e; }
  </style>
</head>
<body class="min-h-screen pb-28">

  <!-- 顶部导航 -->
  <div class="glass fixed top-0 left-0 right-0 z-50 px-4 py-3 flex items-center justify-between">
    <button class="p-2 -ml-2 rounded-full active:bg-gray-100">
      <svg class="w-6 h-6 text-gray-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
      </svg>
    </button>
    <span class="text-base font-semibold text-gray-800">零售开单</span>
    <div class="w-10"></div>
  </div>

  <!-- 主内容区 -->
  <div class="pt-20 px-4 pb-6">

    <!-- 销售类型选择 -->
    <div class="mb-5">
      <div class="text-sm font-medium text-gray-500 mb-3">选择销售类型</div>
      <div class="grid grid-cols-3 gap-3">
        <div class="card p-4 text-center type-card selected cursor-pointer" onclick="selectType(this,'retail')">
          <div class="text-2xl mb-2">🛍️</div>
          <div class="text-sm font-semibold text-gray-800">零售</div>
          <div class="text-xs text-gray-400 mt-1">标准价格</div>
        </div>
        <div class="card p-4 text-center type-card cursor-pointer" onclick="selectType(this,'wholesale')">
          <div class="text-2xl mb-2">📦</div>
          <div class="text-sm font-semibold text-gray-800">批发</div>
          <div class="text-xs text-gray-400 mt-1">批量价格</div>
        </div>
        <div class="card p-4 text-center type-card cursor-pointer" onclick="selectType(this,'engineering')">
          <div class="text-2xl mb-2">🏗️</div>
          <div class="text-sm font-semibold text-gray-800">工程</div>
          <div class="text-xs text-gray-400 mt-1">项目价格</div>
        </div>
      </div>
    </div>

    <!-- 会员绑定区 -->
    <div class="card p-5 mb-4">
      <div class="text-sm font-medium text-gray-500 mb-4">绑定会员（可选）</div>

      <!-- 企微扫码入口 -->
      <div class="btn-scan w-full flex items-center gap-3 p-4 mb-4 cursor-pointer active:bg-gray-50" onclick="scanQR()">
        <div class="w-11 h-11 rounded-2xl bg-green-50 flex items-center justify-center">
          <svg class="w-5 h-5 text-green-600" viewBox="0 0 24 24" fill="currentColor">
            <path d="M3 3h6v6H3V3zm2 2v2h2V5H5zm8-2h6v6h-6V3zm2 2v2h2V5h-2zM5 13h6v6H5v-6zm2 2v2h2v-2H7zm10 0h2v2h-2v-2zm-4 4h2v2h-2v-2zm-2 0h2v2h-2v-2z"/>
          </svg>
        </div>
        <div>
          <div class="text-sm font-semibold text-gray-800">企业微信扫码绑定</div>
          <div class="text-xs text-gray-400 mt-0.5">扫描客户二维码自动识别会员</div>
        </div>
        <svg class="w-5 h-5 text-gray-300 ml-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
        </svg>
      </div>

      <!-- 分隔线 -->
      <div class="flex items-center gap-3 mb-4">
        <div class="flex-1 h-px bg-gray-100"></div>
        <span class="text-xs text-gray-300">或</span>
        <div class="flex-1 h-px bg-gray-100"></div>
      </div>

      <!-- 手机号绑定 -->
      <div class="flex gap-2">
        <input id="phoneInput" type="tel" maxlength="11" placeholder="输入手机号查找会员" class="input-field flex-1 px-4 py-3 text-sm">
        <button onclick="searchMember()" class="btn-primary px-4 py-3 text-sm">查找</button>
      </div>
      <div id="phoneError" class="text-xs text-red-500 mt-2 hidden">该手机号未注册为会员</div>

      <!-- 搜索结果（动态显示） -->
      <div id="memberResult" class="hidden mt-4 p-4 rounded-2xl bg-blue-50 border border-blue-100">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-full bg-blue-100 flex items-center justify-center text-blue-600 font-semibold">张</div>
          <div>
            <div class="text-sm font-semibold text-gray-800">张三</div>
            <div class="text-xs text-gray-500">138****1234 · 金卡会员</div>
          </div>
          <div class="ml-auto">
            <span class="tag tag-retail">已绑定</span>
          </div>
        </div>
        <button onclick="unbindMember()" class="w-full mt-3 py-2 text-sm text-blue-600 font-medium rounded-xl bg-blue-100/50">解除绑定</button>
      </div>
    </div>

    <!-- 散客直接开单 -->
    <div class="card p-5">
      <div class="flex items-start gap-3">
        <div class="w-10 h-10 rounded-full bg-gray-100 flex items-center justify-center flex-shrink-0">
          <svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
          </svg>
        </div>
        <div class="flex-1">
          <div class="text-sm font-semibold text-gray-800">散客直接开单</div>
          <div class="text-xs text-gray-400 mt-1">不绑定会员，无法使用积分和优惠券</div>
        </div>
      </div>
    </div>

  </div>

  <!-- 底部固定按钮 -->
  <div class="fixed bottom-0 left-0 right-0 p-4 bg-white/90 backdrop-blur-xl border-t border-gray-100">
    <button onclick="startRetail()" class="btn-primary w-full py-4 text-base">
      开始开单
    </button>
  </div>

  <script>
    let selectedType = 'retail';

    function selectType(el, type) {
      document.querySelectorAll('.type-card').forEach(c => c.classList.remove('selected'));
      el.classList.add('selected');
      selectedType = type;
    }

    function scanQR() {
      alert('调起相机扫码（Flutter: mobile_scanner）');
    }

    function searchMember() {
      const phone = document.getElementById('phoneInput').value;
      if (!phone || phone.length !== 11) return;
      // 模拟查找
      if (phone === '13800000000') {
        document.getElementById('phoneError').classList.add('hidden');
        document.getElementById('memberResult').classList.remove('hidden');
      } else {
        document.getElementById('phoneError').classList.remove('hidden');
        document.getElementById('memberResult').classList.add('hidden');
      }
    }

    function unbindMember() {
      document.getElementById('memberResult').classList.add('hidden');
      document.getElementById('phoneInput').value = '';
    }

    function startRetail() {
      const member = document.getElementById('memberResult').classList.contains('hidden') ? null : '张三';
      alert('进入商品选购页\n销售类型: ' + selectedType + '\n会员: ' + (member || '散客'));
    }
  </script>
</body>
</html>
