<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>退货列表</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .glass { background: rgba(255,255,255,0.88); backdrop-filter: blur(20px); }
    .card { background: white; border-radius: 14px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .tag { display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:500; }
    .status-pending { background:#fffbeb;color:#92400e; }
    .status-approved { background:#dcfce7;color:#166534; }
    .status-rejected { background:#fef2f2;color:#dc2626; }
    .status-refunded { background:#f3f4f6;color:#6b7280; }
  </style>
</head>
<body class="bg-gray-50 pb-4">

  <!-- 顶部导航 -->
  <div class="glass fixed top-0 left-0 right-0 z-50 px-4 py-3 flex items-center justify-between">
    <button class="p-2 -ml-2 rounded-full active:bg-gray-100" onclick="history.back()">
      <svg class="w-6 h-6 text-gray-700" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
    </button>
    <span class="text-base font-semibold text-gray-800">退货列表</span>
    <div class="w-10"></div>
  </div>

  <div class="pt-14 px-4">

    <!-- Tab 筛选 -->
    <div class="flex gap-2 mb-4 overflow-x-auto pb-1" style="scrollbar-width:none;">
      <button class="px-4 py-2 rounded-full text-sm font-medium bg-white shadow-sm text-blue-600">全部</button>
      <button class="px-4 py-2 rounded-full text-sm font-medium text-gray-500 bg-gray-100 active:bg-white transition-colors">待审核</button>
      <button class="px-4 py-2 rounded-full text-sm font-medium text-gray-500 bg-gray-100 active:bg-white transition-colors">已通过</button>
      <button class="px-4 py-2 rounded-full text-sm font-medium text-gray-500 bg-gray-100 active:bg-white transition-colors">已拒绝</button>
    </div>

    <!-- 退货列表 -->
    <div class="space-y-3 pb-4">

      <!-- 退货1 -->
      <div class="card p-4 cursor-pointer active:scale-[0.99] transition-transform" onclick="goReturnDetail()">
        <div class="flex items-start justify-between mb-3">
          <div>
            <div class="text-xs font-mono text-gray-400">RT-20260515-001</div>
            <div class="text-xs text-gray-400 mt-0.5">10:30 · 今天</div>
          </div>
          <span class="tag status-pending">待审核</span>
        </div>
        <div class="flex items-center justify-between mb-2">
          <div class="text-sm font-medium text-gray-700">关联订单：Z1-20260515-001</div>
        </div>
        <div class="flex items-center gap-2">
          <div class="w-6 h-6 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center text-xs font-semibold">张</div>
          <div class="text-sm text-gray-700">张三</div>
        </div>
        <div class="mt-2 pt-2 border-t border-gray-100 flex justify-between">
          <span class="text-xs text-gray-400">退货商品 3 件</span>
          <span class="text-base font-bold text-orange-500">¥560</span>
        </div>
      </div>

      <!-- 退货2 -->
      <div class="card p-4 cursor-pointer active:scale-[0.99] transition-transform" onclick="goReturnDetail()">
        <div class="flex items-start justify-between mb-3">
          <div>
            <div class="text-xs font-mono text-gray-400">RT-20260514-003</div>
            <div class="text-xs text-gray-400 mt-0.5">16:20 · 昨天</div>
          </div>
          <span class="tag status-approved">已通过</span>
        </div>
        <div class="flex items-center justify-between mb-2">
          <div class="text-sm font-medium text-gray-700">关联订单：Z1-20260514-015</div>
        </div>
        <div class="flex items-center gap-2">
          <div class="w-6 h-6 rounded-full bg-purple-100 text-purple-600 flex items-center justify-center text-xs font-semibold">李</div>
          <div class="text-sm text-gray-700">李四</div>
        </div>
        <div class="mt-2 pt-2 border-t border-gray-100 flex justify-between">
          <span class="text-xs text-gray-400">退货商品 1 件</span>
          <span class="text-base font-bold text-green-600">¥228</span>
        </div>
      </div>

      <!-- 退货3 -->
      <div class="card p-4 cursor-pointer active:scale-[0.99] transition-transform" onclick="goReturnDetail()">
        <div class="flex items-start justify-between mb-3">
          <div>
            <div class="text-xs font-mono text-gray-400">RT-20260513-002</div>
            <div class="text-xs text-gray-400 mt-0.5">11:05 · 前天</div>
          </div>
          <span class="tag status-rejected">已拒绝</span>
        </div>
        <div class="flex items-center justify-between mb-2">
          <div class="text-sm font-medium text-gray-700">关联订单：Z1-20260513-011</div>
        </div>
        <div class="flex items-center gap-2">
          <div class="w-6 h-6 rounded-full bg-gray-200 text-gray-500 flex items-center justify-center text-xs font-semibold">散</div>
          <div class="text-sm text-gray-500">散客</div>
        </div>
        <div class="mt-2 pt-2 border-t border-gray-100 flex justify-between">
          <span class="text-xs text-gray-400">退货商品 2 件</span>
          <span class="text-base font-bold text-gray-400">¥1,800</span>
        </div>
      </div>

    </div>
  </div>

  <script>
    function goReturnDetail() { alert('跳转退货详情页'); }
  </script>
</body>
</html>
