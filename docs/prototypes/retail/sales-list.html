<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>销售订单列表</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .glass { background: rgba(255,255,255,0.88); backdrop-filter: blur(20px); }
    .card { background: white; border-radius: 14px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .tag { display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:500; }
    .status-unpaid { background:#fef2f2;color:#dc2626; }
    .status-paid { background:#dcfce7;color:#166534; }
    .status-finished { background:#eff6ff;color:#1d4ed8; }
    .status-refunded { background:#f3f4f6;color:#6b7280; }
    .type-retail { background:#eff6ff;color:#1d4ed8; }
    .type-wholesale { background:#f0fdf4;color:#166534; }
    .type-engineering { background:#fffbeb;color:#92400e; }
    .order-card { transition: transform 0.15s; }
    .order-card:active { transform: scale(0.99); }
    .tab { padding: 6px 14px; border-radius: 9999px; font-size: 13px; font-weight: 500; transition: all 0.2s; }
    .tab-active { background: white; box-shadow: 0 2px 8px rgba(0,0,0,0.1); color: #2563eb; }
    .filter-bar { overflow-x: auto; scrollbar-width: none; }
    .filter-bar::-webkit-scrollbar { display: none; }
    .swipe-wrap { position: relative; overflow: hidden; }
    .swipe-action { position: absolute; right: 0; top: 0; bottom: 0; width: 80px; display: flex; align-items: center; justify-content: center; border-radius: 14px; }
    .swipe-btn { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  </style>
</head>
<body class="bg-gray-50 pb-6">

  <!-- 顶部导航 -->
  <div class="glass fixed top-0 left-0 right-0 z-50 px-4 py-3">
    <div class="text-center text-base font-semibold text-gray-800">销售订单</div>
  </div>

  <div class="pt-14 px-4">

    <!-- 搜索框 -->
    <div class="mb-3 relative">
      <input type="text" id="searchInput" placeholder="搜索订单号/会员姓名/手机号" class="w-full bg-white rounded-2xl px-4 py-2.5 pl-10 text-sm shadow-sm focus:ring-2 focus:ring-blue-100 focus:outline-none transition-all" oninput="filterList()">
      <svg class="w-4 h-4 text-gray-400 absolute left-3 top-1/2 -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
    </div>

    <!-- 横向Tab（时间 + 状态） -->
    <div class="mb-3 flex flex-col gap-2">
      <!-- 时间Tab -->
      <div class="filter-bar flex gap-2">
        <button class="tab tab-active flex-shrink-0 text-blue-600" onclick="setTimeTab(this,'today')">今日</button>
        <button class="tab flex-shrink-0 text-gray-500 bg-gray-100" onclick="setTimeTab(this,'week')">本周</button>
        <button class="tab flex-shrink-0 text-gray-500 bg-gray-100" onclick="setTimeTab(this,'month')">本月</button>
        <button class="tab flex-shrink-0 text-gray-500 bg-gray-100" onclick="setTimeTab(this,'all')">全部</button>
        <!-- 状态Tab -->
        <div class="h-full border-l border-gray-200 mx-1"></div>
        <button class="tab tab-active flex-shrink-0 text-blue-600" onclick="setStatusTab(this,'all')">全部</button>
        <button class="tab flex-shrink-0 text-gray-500 bg-gray-100" onclick="setStatusTab(this,'unpaid')">待付款</button>
        <button class="tab flex-shrink-0 text-gray-500 bg-gray-100" onclick="setStatusTab(this,'paid')">已付款</button>
        <button class="tab flex-shrink-0 text-gray-500 bg-gray-100" onclick="setStatusTab(this,'finished')">已完成</button>
        <button class="tab flex-shrink-0 text-gray-500 bg-gray-100" onclick="setStatusTab(this,'refunded')">已退款</button>
        <!-- 高级筛选 -->
        <button class="flex-shrink-0 flex items-center gap-1 px-3 py-2 rounded-full bg-gray-100 text-xs text-gray-500 active:bg-gray-200 transition-colors" onclick="showFilter()">
          <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"/></svg>
          筛选
        </button>
      </div>
    </div>

    <!-- 统计摘要 -->
    <div class="mb-3 p-3 rounded-2xl bg-blue-50 border border-blue-100 flex justify-between text-sm">
      <div>
        <span class="text-gray-500">今日订单</span>
        <span class="ml-2 font-bold text-blue-600">23</span>
      </div>
      <div>
        <span class="text-gray-500">今日销售额</span>
        <span class="ml-2 font-bold text-red-500">¥86,520</span>
      </div>
    </div>

    <!-- 订单列表 -->
    <div class="space-y-3" id="orderList">

      <!-- 订单1 - 已完成 -->
      <div class="card p-4 order-card cursor-pointer" onclick="goDetail('Z1-20260515-001')">
        <div class="flex items-start justify-between mb-3">
          <div>
            <div class="text-xs font-mono text-gray-400">#Z1-20260515-001</div>
            <div class="flex items-center gap-1.5 mt-1">
              <span class="tag type-retail text-xs">零售</span>
              <span class="text-xs text-gray-400">10:30</span>
            </div>
          </div>
          <div class="text-right">
            <div class="text-base font-bold text-red-500">¥21,378</div>
            <span class="tag status-finished mt-1">已完成</span>
          </div>
        </div>
        <div class="flex items-center gap-2">
          <div class="w-6 h-6 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center text-xs font-semibold">张</div>
          <div class="text-sm font-medium text-gray-700">张三</div>
          <span class="tag text-xs px-2 py-0.5 rounded-full bg-yellow-50 text-yellow-700">金卡</span>
          <span class="text-xs text-gray-400 ml-auto">3件商品</span>
        </div>
      </div>

      <!-- 订单2 - 已付款 -->
      <div class="card p-4 order-card cursor-pointer" onclick="goDetail('Z1-20260515-002')">
        <div class="flex items-start justify-between mb-3">
          <div>
            <div class="text-xs font-mono text-gray-400">#Z1-20260515-002</div>
            <div class="flex items-center gap-1.5 mt-1">
              <span class="tag type-retail text-xs">零售</span>
              <span class="text-xs text-gray-400">09:15</span>
            </div>
          </div>
          <div class="text-right">
            <div class="text-base font-bold text-red-500">¥890</div>
            <span class="tag status-paid mt-1">已付款</span>
          </div>
        </div>
        <div class="flex items-center gap-2">
          <div class="w-6 h-6 rounded-full bg-purple-100 text-purple-600 flex items-center justify-center text-xs font-semibold">李</div>
          <div class="text-sm font-medium text-gray-700">李四</div>
          <span class="tag text-xs px-2 py-0.5 rounded-full bg-gray-100 text-gray-600">银卡</span>
          <span class="text-xs text-gray-400 ml-auto">3件商品</span>
        </div>
      </div>

      <!-- 订单3 - 待付款 -->
      <div class="card p-4 order-card cursor-pointer" onclick="goDetail('Z1-20260515-003')">
        <div class="flex items-start justify-between mb-3">
          <div>
            <div class="text-xs font-mono text-gray-400">#Z1-20260515-003</div>
            <div class="flex items-center gap-1.5 mt-1">
              <span class="tag type-wholesale text-xs">批发</span>
              <span class="text-xs text-gray-400">08:50</span>
            </div>
          </div>
          <div class="text-right">
            <div class="text-base font-bold text-gray-300">¥5,600</div>
            <span class="tag status-unpaid mt-1">待付款</span>
          </div>
        </div>
        <div class="flex items-center gap-2">
          <div class="w-6 h-6 rounded-full bg-gray-200 text-gray-500 flex items-center justify-center text-xs font-semibold">散</div>
          <div class="text-sm font-medium text-gray-500">散客</div>
          <span class="text-xs text-gray-400 ml-auto">5件商品</span>
        </div>
      </div>

      <!-- 订单4 - 已退款 -->
      <div class="card p-4 order-card cursor-pointer" onclick="goDetail('Z1-20260514-028')">
        <div class="flex items-start justify-between mb-3">
          <div>
            <div class="text-xs font-mono text-gray-400">#Z1-20260514-028</div>
            <div class="flex items-center gap-1.5 mt-1">
              <span class="tag type-retail text-xs">零售</span>
              <span class="text-xs text-gray-400">昨天 18:20</span>
            </div>
          </div>
          <div class="text-right">
            <div class="text-base font-bold text-gray-400 line-through">¥560</div>
            <span class="tag status-refunded mt-1">已退款</span>
          </div>
        </div>
        <div class="flex items-center gap-2">
          <div class="w-6 h-6 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center text-xs font-semibold">张</div>
          <div class="text-sm font-medium text-gray-700">张三</div>
          <span class="tag text-xs px-2 py-0.5 rounded-full bg-yellow-50 text-yellow-700">金卡</span>
          <span class="text-xs text-gray-400 ml-auto">2件商品</span>
        </div>
      </div>

      <!-- 订单5 - 工程订单 -->
      <div class="card p-4 order-card cursor-pointer" onclick="goDetail('Z1-20260514-027')">
        <div class="flex items-start justify-between mb-3">
          <div>
            <div class="text-xs font-mono text-gray-400">#Z1-20260514-027</div>
            <div class="flex items-center gap-1.5 mt-1">
              <span class="tag type-engineering text-xs">工程</span>
              <span class="text-xs text-gray-400">昨天 16:05</span>
            </div>
          </div>
          <div class="text-right">
            <div class="text-base font-bold text-red-500">¥128,000</div>
            <span class="tag status-finished mt-1">已完成</span>
          </div>
        </div>
        <div class="flex items-center gap-2">
          <div class="w-6 h-6 rounded-full bg-green-100 text-green-600 flex items-center justify-center text-xs font-semibold">赵</div>
          <div class="text-sm font-medium text-gray-700">赵六</div>
          <span class="tag text-xs px-2 py-0.5 rounded-full bg-gray-100 text-gray-600">普通</span>
          <span class="text-xs text-gray-400 ml-auto">12件商品</span>
        </div>
      </div>

    </div>

    <!-- 加载更多提示 -->
    <div class="text-center py-6 text-xs text-gray-400">上拉加载更多</div>

  </div>

  <script>
    function setTimeTab(el, period) {
      el.parentElement.querySelectorAll('.tab').forEach(t => {
        if (t.textContent === el.textContent && t !== el) {
          t.classList.add('tab-active');
          t.classList.remove('text-gray-500', 'bg-gray-100');
          el.classList.remove('tab-active');
          el.classList.add('text-gray-500', 'bg-gray-100');
        }
      });
      filterList();
    }

    function setStatusTab(el, status) {
      const tabs = el.parentElement.querySelectorAll('.tab');
      tabs.forEach(t => {
        t.classList.remove('tab-active');
        t.classList.add('text-gray-500', 'bg-gray-100');
      });
      el.classList.add('tab-active');
      el.classList.remove('text-gray-500', 'bg-gray-100');
      filterList();
    }

    function filterList() {
      const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
      const cards = document.querySelectorAll('.order-card');
      cards.forEach(card => {
        const text = card.textContent.toLowerCase();
        card.style.display = (!keyword || text.includes(keyword)) ? '' : 'none';
      });
    }

    function goDetail(orderNum) {
      alert('跳转订单详情页: ' + orderNum);
    }

    function showFilter() {
      alert('打开高级筛选面板（时间范围/门店/职员/销售类型/金额范围）');
    }
  </script>
</body>
</html>
