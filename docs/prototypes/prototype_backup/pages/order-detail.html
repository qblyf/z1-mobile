<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>订单详情 - Z1 全网连锁</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        body { font-family: -apple-system, system-ui, sans-serif; background: #F2F2F7; margin: 0; }
        .status-bar { height: 54px; padding: 14px 24px 0; display: flex; justify-content: space-between; align-items: center; color: #000; font-size: 15px; font-weight: 600; }
        .section-card { background: white; border-radius: 12px; margin: 12px 16px; overflow: hidden; }
        .action-btn { background: #007AFF; color: white; border: none; border-radius: 12px; padding: 14px; font-size: 16px; font-weight: 600; width: 100%; cursor: pointer; }
        .action-btn:active { transform: scale(0.98); background: #0066CC; }
    </style>
</head>
<body>

    <!-- Status Bar -->
    <div class="status-bar">
        <span>9:41</span>
        <div class="flex gap-1 items-center"><i class="fas fa-signal text-xs"></i><i class="fas fa-wifi text-xs"></i><i class="fas fa-battery-full text-xs"></i></div>
    </div>

    <!-- Header -->
    <div class="bg-gradient-to-r from-blue-500 to-blue-600 text-white px-4 py-6 rounded-b-3xl">
        <div class="flex items-center gap-3 mb-2">
            <button onclick="history.back()" class="text-white"><i class="fas fa-chevron-left text-lg"></i></button>
            <span class="font-semibold text-lg flex-1">订单详情</span>
            <span class="badge bg-white/20 px-3 py-1 rounded-full text-sm">已完成</span>
        </div>
        <div class="text-3xl font-bold mt-2">¥328.00</div>
        <div class="text-blue-100 text-sm mt-1">订单号：#SO20260514001</div>
    </div>

    <!-- Content -->
    <div class="pb-32">

        <!-- Order Info -->
        <div class="section-card">
            <div class="p-4 border-b border-gray-100">
                <div class="flex justify-between items-center">
                    <span class="text-gray-500">下单时间</span>
                    <span class="text-gray-900">2026-05-14 14:32:18</span>
                </div>
            </div>
            <div class="p-4 border-b border-gray-100">
                <div class="flex justify-between items-center">
                    <span class="text-gray-500">顾客</span>
                    <span class="text-gray-900">张三（138****8888）</span>
                </div>
            </div>
            <div class="p-4 border-b border-gray-100">
                <div class="flex justify-between items-center">
                    <span class="text-gray-500">收银员</span>
                    <span class="text-gray-900">小李</span>
                </div>
            </div>
            <div class="p-4">
                <div class="flex justify-between items-center">
                    <span class="text-gray-500">支付方式</span>
                    <span class="flex items-center gap-2 text-green-600">
                        <i class="fab fa-weixin"></i> 微信支付
                    </span>
                </div>
            </div>
        </div>

        <!-- Product List -->
        <div class="section-card">
            <div class="p-4 font-semibold text-lg border-b border-gray-100">商品明细</div>

            <div class="p-4 border-b border-gray-100">
                <div class="flex gap-3">
                    <div class="w-16 h-16 bg-gray-200 rounded-lg flex items-center justify-center text-gray-400">
                        <i class="fas fa-box text-xl"></i>
                    </div>
                    <div class="flex-1">
                        <div class="font-medium">iPhone 15 Pro 256GB</div>
                        <div class="text-gray-500 text-sm mt-1">¥8999.00 × 1</div>
                    </div>
                    <div class="font-semibold">¥8999.00</div>
                </div>
            </div>

            <div class="p-4 border-b border-gray-100">
                <div class="flex gap-3">
                    <div class="w-16 h-16 bg-gray-200 rounded-lg flex items-center justify-center text-gray-400">
                        <i class="fas fa-box text-xl"></i>
                    </div>
                    <div class="flex-1">
                        <div class="font-medium">MagSafe 磁吸充电器</div>
                        <div class="text-gray-500 text-sm mt-1">¥149.00 × 1</div>
                    </div>
                    <div class="font-semibold">¥149.00</div>
                </div>
            </div>

            <div class="p-4 border-b border-gray-100">
                <div class="flex gap-3">
                    <div class="w-16 h-16 bg-gray-200 rounded-lg flex items-center justify-center text-gray-400">
                        <i class="fas fa-box text-xl"></i>
                    </div>
                    <div class="flex-1">
                        <div class="font-medium">AirPods Pro 2</div>
                        <div class="text-gray-500 text-sm mt-1">¥1899.00 × 1</div>
                    </div>
                    <div class="font-semibold">¥1899.00</div>
                </div>
            </div>

            <div class="p-4 flex justify-between items-center bg-gray-50">
                <span class="text-gray-500">共 3 件商品</span>
                <span class="font-bold text-xl text-orange-600">¥11047.00</span>
            </div>
        </div>

        <!-- Actions -->
        <div class="px-4 pt-2">
            <button class="action-btn mb-3 flex items-center justify-center gap-2" onclick="showPrintDialog()">
                <i class="fas fa-print"></i> 打印小票
            </button>
            <button class="action-btn bg-red-500" onclick="showRefundDialog()">
                申请退款
            </button>
        </div>

    </div>

    <script>
        function showPrintDialog() {
            alert('正在连接打印机...');
        }
        function showRefundDialog() {
            if (confirm('确定要申请退款吗？')) {
                alert('退款申请已提交');
            }
        }
    </script>

</body>
</html>
