name: z1_mobile
description: Z1 全网连锁系统 Flutter App
publish_to: 'none'
version: 1.0.6+6

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 状态管理
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # 依赖注入
  get_it: ^7.7.0
  injectable: ^2.4.4

  # 路由
  go_router: ^14.6.2

  # 网络层
  dio: ^5.7.0

  # 本地存储
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.2

  # UI
  cupertino_icons: ^1.0.8

  # 扫码
  mobile_scanner: ^5.2.3

  # JSON 序列化
  json_annotation: ^4.9.0

  # 工具
  dartz: ^0.10.1
  freezed_annotation: ^2.4.4
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.13
  json_serializable: ^6.8.0
  freezed: ^2.5.7
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true