tasks:
  # ===== Task 1: Core API Layer =====
  - id: core-api-layer
    title: '核心 API 层'
    prompt: |
      在 /Users/fan/www/Ai/Phone/Flutter/z1-nextapp/z1_mobile/ 项目中实现核心 API 层。

      ## 工作内容

      1. 创建 `lib/core/api/api_client.dart`:
         - 基于 Dio 的 HTTP 客户端
         - 支持 Token 自动注入（从 flutter_secure_storage）
         - 错误处理封装
         - 参考 z1-mid/src/model/z1/order.ts 的 API 模式

      2. 创建 `lib/core/api/api_interceptor.dart`:
         - 请求拦截器：自动添加 Authorization header
         - 响应拦截器：处理 401 自动刷新 Token
         - 错误拦截器：统一错误格式

      3. 创建 `lib/core/api/api_endpoints.dart`:
         - 定义所有 API 端点常量
         - 参考 z1-mid 的 API 路径

      4. 创建 `lib/core/api/result.dart`:
         - 统一返回结果类型
         - Either<Failure, Success> 模式

      5. 创建 Token 存储服务 `lib/core/services/token_service.dart`:
         - flutter_secure_storage 存储
         - Token 读取/写入/清除
         - 自动刷新逻辑

      ## API 端点（参考 z1-mid）

      ```dart
      // 认证
      POST /auth/login           → 登录
      POST /auth/refresh-token  → 刷新 Token

      // 订单
      POST /order/sale-shop-add        → 创建零售单
      POST /order/shop-sale-list       → 查询零售单列表
      GET  /order/shop-sale-count      → 查询零售单数量

      // 会员
      POST /members/search-by-phones   → 手机号查会员
      GET  /members/:ident             → 会员详情
      GET  /members/experience/:ident → 积分查询

      // 商品
      POST /product/search              → 商品搜索
      GET  /product/list                → 商品列表

      // 货品
      POST /goods/serial-trace          → 序列号查询
      ```

      ## 代码规范

      - 使用 json_serializable 生成 model
      - 所有 API 调用返回 Result<T> 类型
      - 错误使用 Either<Failure, T>
      - 遵循 Flutter 风格指南

      ## 验证标准

      - 代码编译通过（flutter analyze）
      - API 端点定义完整
      - Token 管理逻辑正确
      - 有单元测试覆盖核心逻辑

      工作完成后报告：创建的文件列表、关键类型定义、验证结果。
    assigned_to: coder
    verified_by: verifier
    verify_prompt: |
      验证 core-api-layer 的实现：

      1. 运行 `flutter analyze` 确认无编译错误
      2. 检查 API 端点是否覆盖核心功能（订单/会员/商品）
      3. 检查 Token 管理是否正确（存储/读取/刷新）
      4. 检查 Result 类型是否符合 Either 模式
      5. 检查是否有基础单元测试

      如有问题，说明具体位置和修复建议。
    timeout_ms: 1800000

