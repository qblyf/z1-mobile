<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>首页 - Z1 全网连锁</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        body { font-family: -apple-system, system-ui, "SF Pro Text", sans-serif; background: #F2F2F7; margin: 0; padding: 0; overflow: hidden; }
    </style>
</head>
<body class="h-screen flex flex-col">

    <!-- Navigation Bar -->
    <div class="bg-white/80 backdrop-blur-xl border-b border-gray-200/50" style="padding-top: 54px;">
        <div class="h-12 px-4 flex items-center justify-between">
            <h1 class="text-lg font-semibold text-gray-900">Z1 全网连锁</h1>
            <button onclick="logout()" class="w-10 h-10 flex items-center justify-center -mr-2 rounded-full active:bg-gray-200 transition-colors">
                <i class="fas fa-power-off text-gray-500"></i>
            </button>
        </div>
    </div>

    <!-- Content -->
    <div class="flex-1 overflow-auto px-4 pt-6 pb-8">

        <!-- Welcome Card -->
        <div class="bg-gradient-to-br from-blue-500 to-blue-600 rounded-3xl p-5 mb-6 shadow-xl shadow-blue-500/20">
            <div class="flex items-center gap-4">
                <div class="w-14 h-14 bg-white/20 rounded-2xl flex items-center justify-center">
                    <i class="fas fa-user text-white text-xl"></i>
                </div>
                <div class="flex-1">
                    <h2 class="text-white text-xl font-bold">欢迎回来，张店长</h2>
                    <p class="text-blue-100 text-sm mt-1">门店：龙华壹方城店</p>
                </div>
            </div>
            <div class="flex gap-3 mt-4">
                <div class="flex-1 bg-white/20 rounded-2xl py-3 text-center">
                    <div class="text-white text-lg font-bold">¥12,580</div>
                    <div class="text-blue-100 text-xs mt-1">今日营收</div>
                </div>
                <div class="flex-1 bg-white/20 rounded-2xl py-3 text-center">
                    <div class="text-white text-lg font-bold">36</div>
                    <div class="text-blue-100 text-xs mt-1">今日订单</div>
                </div>
                <div class="flex-1 bg-white/20 rounded-2xl py-3 text-center">
                    <div class="text-white text-lg font-bold">5</div>
                    <div class="text-blue-100 text-xs mt-1">待审批</div>
                </div>
            </div>
        </div>

        <!-- Quick Actions -->
        <div class="mb-6">
            <h3 class="text-gray-500 text-sm font-medium mb-3 px-1">快捷操作</h3>
            <div class="flex gap-3">
                <button onclick="scanBarcode()" class="flex-1 bg-white rounded-2xl p-4 flex items-center gap-3 shadow-sm active:scale-95 transition-transform">
                    <div class="w-12 h-12 bg-green-500 rounded-xl flex items-center justify-center">
                        <i class="fas fa-barcode text-white text-lg"></i>
                    </div>
                    <div class="text-left">
                        <div class="font-semibold text-gray-900">扫码开单</div>
                        <div class="text-gray-400 text-xs">快速零售</div>
                    </div>
                </button>
                <button onclick="scanMember()" class="flex-1 bg-white rounded-2xl p-4 flex items-center gap-3 shadow-sm active:scale-95 transition-transform">
                    <div class="w-12 h-12 bg-purple-500 rounded-xl flex items-center justify-center">
                        <i class="fas fa-id-card text-white text-lg"></i>
                    </div>
                    <div class="text-left">
                        <div class="font-semibold text-gray-900">会员识别</div>
                        <div class="text-gray-400 text-xs">扫码查信息</div>
                    </div>
                </button>
            </div>
        </div>

        <!-- Menu Grid -->
        <div>
            <h3 class="text-gray-500 text-sm font-medium mb-3 px-1">功能菜单</h3>
            <div class="grid grid-cols-2 gap-4">

                <!-- 零售开单 -->
                <button onclick="goTo('retail-edit.html')" class="bg-white rounded-2xl p-5 text-left shadow-sm active:scale-98 transition-transform">
                    <div class="w-12 h-12 bg-blue-500 rounded-xl flex items-center justify-center mb-3">
                        <i class="fas fa-shopping-cart text-white text-lg"></i>
                    </div>
                    <div class="font-semibold text-gray-900">零售开单</div>
                    <div class="text-gray-400 text-xs mt-1">快速收款</div>
                </button>

                <!-- 订单列表 -->
                <button onclick="goTo('order-list.html')" class="bg-white rounded-2xl p-5 text-left shadow-sm active:scale-98 transition-transform">
                    <div class="w-12 h-12 bg-green-500 rounded-xl flex items-center justify-center mb-3">
                        <i class="fas fa-file-alt text-white text-lg"></i>
                    </div>
                    <div class="font-semibold text-gray-900">订单列表</div>
                    <div class="text-gray-400 text-xs mt-1">查看订单</div>
                </button>

                <!-- 库存管理 -->
                <button onclick="goTo('stocktaking.html')" class="bg-white rounded-2xl p-5 text-left shadow-sm active:scale-98 transition-transform">
                    <div class="w-12 h-12 bg-orange-500 rounded-xl flex items-center justify-center mb-3">
                        <i class="fas fa-boxes text-white text-lg"></i>
                    </div>
                    <div class="font-semibold text-gray-900">库存管理</div>
                    <div class="text-gray-400 text-xs mt-1">盘库调拨</div>
                </button>

                <!-- 会员中心 -->
                <button onclick="goTo('member-home.html')" class="bg-white rounded-2xl p-5 text-left shadow-sm active:scale-98 transition-transform">
                    <div class="w-12 h-12 bg-purple-500 rounded-xl flex items-center justify-center mb-3">
                        <i class="fas fa-users text-white text-lg"></i>
                    </div>
                    <div class="font-semibold text-gray-900">会员中心</div>
                    <div class="text-gray-400 text-xs mt-1">会员管理</div>
                </button>

                <!-- 行事历 -->
                <button class="bg-white rounded-2xl p-5 text-left shadow-sm active:scale-98 transition-transform">
                    <div class="w-12 h-12 bg-teal-500 rounded-xl flex items-center justify-center mb-3">
                        <i class="fas fa-calendar-alt text-white text-lg"></i>
                    </div>
                    <div class="font-semibold text-gray-900">行事历</div>
                    <div class="text-gray-400 text-xs mt-1">任务日程</div>
                </button>

                <!-- 审批中心 -->
                <button onclick="goTo('approval.html')" class="bg-white rounded-2xl p-5 text-left shadow-sm active:scale-98 transition-transform">
                    <div class="w-12 h-12 bg-red-500 rounded-xl flex items-center justify-center mb-3">
                        <i class="fas fa-check-circle text-white text-lg"></i>
                    </div>
                    <div class="font-semibold text-gray-900">审批中心</div>
                    <div class="text-gray-400 text-xs mt-1">审批处理</div>
                </button>

            </div>
        </div>

    </div>

    <!-- Tab Bar -->
    <div class="bg-white/80 backdrop-blur-xl border-t border-gray-200/50 pb-8">
        <div class="flex justify-around py-2">
            <button class="flex flex-col items-center px-4 py-2">
                <i class="fas fa-home text-blue-500 text-xl"></i>
                <span class="text-blue-500 text-xs mt-1 font-medium">首页</span>
            </button>
            <button class="flex flex-col items-center px-4 py-2 opacity-50">
                <i class="fas fa-file-alt text-gray-400 text-xl"></i>
                <span class="text-gray-400 text-xs mt-1">订单</span>
            </button>
            <button class="flex flex-col items-center px-4 py-2 opacity-50">
                <i class="fas fa-box text-gray-400 text-xl"></i>
                <span class="text-gray-400 text-xs mt-1">库存</span>
            </button>
            <button class="flex flex-col items-center px-4 py-2 opacity-50">
                <i class="fas fa-user text-gray-400 text-xl"></i>
                <span class="text-gray-400 text-xs mt-1">我的</span>
            </button>
        </div>
    </div>

    <script>
        function goTo(page) {
            window.location.href = page;
        }

        function scanBarcode() {
            goTo('retail-edit.html');
        }

        function scanMember() {
            goTo('member-home.html');
        }

        function logout() {
            if (confirm('确定要退出登录吗？')) {
                window.location.href = 'login.html';
            }
        }
    </script>
</body>
</html>
