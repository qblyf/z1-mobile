<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>登录 - Z1 全网连锁</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>tailwind.config = { theme: { extend: { colors: { brand: '#007AFF' } } } }</script>
    <style>
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        body { font-family: -apple-system, system-ui, "SF Pro Text", sans-serif; background: #F2F2F7; margin: 0; padding: 0; }
        .status-bar { height: 54px; padding: 14px 24px 0; display: flex; justify-content: space-between; align-items: center; color: #000; font-size: 15px; font-weight: 600; }
        .login-btn { background: #007AFF; color: white; border: none; border-radius: 12px; padding: 16px; font-size: 17px; font-weight: 600; width: 100%; cursor: pointer; transition: all 0.2s; }
        .login-btn:active { transform: scale(0.98); background: #0066CC; }
        .login-btn:disabled { background: #C7C7CC; cursor: not-allowed; }
        .input-field { width: 100%; padding: 16px; border: none; border-radius: 12px; font-size: 17px; background: white; outline: none; }
        .input-field:focus { box-shadow: 0 0 0 3px rgba(0,122,255,0.3); }
    </style>
</head>
<body class="min-h-screen">

    <!-- Status Bar -->
    <div class="status-bar">
        <span>9:41</span>
        <div class="flex gap-1 items-center">
            <i class="fas fa-signal text-xs"></i>
            <i class="fas fa-wifi text-xs"></i>
            <i class="fas fa-battery-full text-xs"></i>
        </div>
    </div>

    <!-- Content -->
    <div class="px-6 pt-8">
        <!-- Logo & Title -->
        <div class="text-center mb-12">
            <div class="w-24 h-24 bg-gradient-to-br from-blue-500 to-blue-600 rounded-3xl mx-auto mb-6 flex items-center justify-center shadow-lg">
                <span class="text-white text-4xl font-bold">Z1</span>
            </div>
            <h1 class="text-3xl font-bold text-gray-900">Z1 全网连锁</h1>
            <p class="text-gray-500 mt-2">门店管理移动端</p>
        </div>

        <!-- Login Form -->
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-600 mb-2 ml-1">手机号</label>
                <input type="tel" class="input-field" placeholder="请输入手机号" value="99999999999">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-600 mb-2 ml-1">密码</label>
                <div class="relative">
                    <input type="password" id="password-input" class="input-field pr-12" placeholder="请输入密码" value="ncxSEpbZ$20m$W6O">
                    <button onclick="togglePassword()" class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400">
                        <i class="fas fa-eye" id="eye-icon"></i>
                    </button>
                </div>
            </div>

            <div class="flex items-center justify-between px-1 py-2">
                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" checked class="w-5 h-5 accent-blue-500 rounded">
                    <span class="text-gray-600 text-sm">记住我</span>
                </label>
                <a href="#" class="text-blue-500 text-sm font-medium">忘记密码？</a>
            </div>

            <button class="login-btn mt-6" onclick="login()">
                登录
            </button>
        </div>

        <!-- Footer -->
        <div class="text-center mt-12 text-gray-400 text-xs">
            <p>登录即表示同意<a href="#" class="text-blue-500">《用户协议》</a>和<a href="#" class="text-blue-500">《隐私政策》</a></p>
        </div>
    </div>

    <script>
        function togglePassword() {
            const input = document.getElementById('password-input');
            const icon = document.getElementById('eye-icon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'fas fa-eye-slash';
            } else {
                input.type = 'password';
                icon.className = 'fas fa-eye';
            }
        }

        function login() {
            const btn = document.querySelector('.login-btn');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>登录中...';
            btn.disabled = true;

            setTimeout(() => {
                window.location.href = 'home.html';
            }, 1500);
        }
    </script>

</body>
</html>
