<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>零售单编辑 - Z1 全网连锁</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        body { font-family: -apple-system, system-ui, "SF Pro Text", sans-serif; background: #F2F2F7; margin: 0; padding: 0; overflow: hidden; }
        input[type="number"]::-webkit-inner-spin-button, input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; }
    </style>
</head>
<body class="h-screen flex flex-col">

    <!-- Navigation Bar -->
    <div class="bg-white/80 backdrop-blur-xl" style="padding-top: 54px;">
        <div class="h-14 px-4 flex items-center justify-between">
            <button onclick="history.back()" class="w-10 h-10 flex items-center justify-center -ml-2 rounded-full active:bg-gray-200">
                <i class="fas fa-chevron-left text-gray-900"></i>
            </button>
            <h1 class="text-lg font-semibold text-gray-900">零售开单</h1>
            <button onclick="clearCart()" class="text-blue-500 text-sm font-medium">清空</button>
        </div>
    </div>

    <!-- Content -->
    <div class="flex-1 overflow-auto pb-36">

        <!-- Cart Items -->
        <div class="bg-white mx-4 mt-4 rounded-2xl overflow-hidden shadow-sm" id="cartList">
            <!-- Item 1 -->
            <div class="p-4 border-b border-gray-100">
                <div class="flex gap-3">
                    <div class="w-16 h-16 bg-gray-100 rounded-xl flex items-center justify-center flex-shrink-0">
                        <i class="fas fa-box text-gray-400 text-xl"></i>
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="font-medium text-gray-900">iPhone 15 Pro 256GB 钛金属</div>
                        <div class="text-gray-400 text-sm mt-1">¥8,799.00</div>
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="decreaseQty(this)" class="w-8 h-8 bg-gray-100 rounded-lg flex items-center justify-center active:bg-gray-200">
                            <i class="fas fa-minus text-gray-600 text-xs"></i>
                        </button>
                        <input type="number" value="1" min="1" class="w-10 text-center text-base font-medium bg-transparent">
                        <button onclick="increaseQty(this)" class="w-8 h-8 bg-gray-100 rounded-lg flex items-center justify-center active:bg-gray-200">
                            <i class="fas fa-plus text-gray-600 text-xs"></i>
                        </button>
                    </div>
                </div>
                <div class="flex justify-between items-center mt-3 pt-3 border-t border-gray-50">
                    <span class="text-gray-400 text-sm">小计</span>
                    <span class="font-semibold text-gray-900">¥8,799.00</span>
                </div>
            </div>

            <!-- Item 2 -->
            <div class="p-4 border-b border-gray-100">
                <div class="flex gap-3">
                    <div class="w-16 h-16 bg-gray-100 rounded-xl flex items-center justify-center flex-shrink-0">
                        <i class="fas fa-box text-gray-400 text-xl"></i>
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="font-medium text-gray-900">AirPods Pro 2 无线耳机</div>
                        <div class="text-gray-400 text-sm mt-1">¥1,799.00</div>
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="decreaseQty(this)" class="w-8 h-8 bg-gray-100 rounded-lg flex items-center justify-center active:bg-gray-200">
                            <i class="fas fa-minus text-gray-600 text-xs"></i>
                        </button>
                        <input type="number" value="2" min="1" class="w-10 text-center text-base font-medium bg-transparent">
                        <button onclick="increaseQty(this)" class="w-8 h-8 bg-gray-100 rounded-lg flex items-center justify-center active:bg-gray-200">
                            <i class="fas fa-plus text-gray-600 text-xs"></i>
                        </button>
                    </div>
                </div>
                <div class="flex justify-between items-center mt-3 pt-3 border-t border-gray-50">
                    <span class="text-gray-400 text-sm">小计</span>
                    <span class="font-semibold text-gray-900">¥3,598.00</span>
                </div>
            </div>

            <!-- Empty state (hidden when items exist) -->
            <div id="emptyCart" class="p-8 text-center hidden">
                <i class="fas fa-shopping-cart text-gray-300 text-4xl mb-3"></i>
                <p class="text-gray-400">购物车是空的</p>
                <p class="text-gray-400 text-sm mt-1">点击下方扫码添加商品</p>
            </div>
        </div>

        <!-- Add Product Button -->
        <div class="mx-4 mt-4 flex gap-3">
            <button onclick="scanProduct()" class="flex-1 bg-blue-500 text-white font-semibold py-4 rounded-2xl flex items-center justify-center gap-2 active:scale-95 transition-transform shadow-lg shadow-blue-500/30">
                <i class="fas fa-barcode"></i>
                <span>扫码添加</span>
            </button>
            <button onclick="searchProduct()" class="flex-1 bg-white text-gray-700 font-semibold py-4 rounded-2xl flex items-center justify-center gap-2 active:scale-95 transition-transform shadow-sm border border-gray-200">
                <i class="fas fa-search"></i>
                <span>搜索商品</span>
            </button>
        </div>

        <!-- Summary -->
        <div class="mx-4 mt-6 p-4 bg-white rounded-2xl shadow-sm">
            <div class="flex justify-between items-center">
                <span class="text-gray-500">共 3 件商品</span>
                <div class="flex items-center gap-2">
                    <span class="text-gray-600">应收</span>
                    <span class="text-2xl font-bold text-blue-500">¥12,397.00</span>
                </div>
            </div>
        </div>

    </div>

    <!-- Bottom Action Bar -->
    <div class="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-xl border-t border-gray-200/50 p-4 pb-8">
        <div class="flex gap-3">
            <div class="flex-1 bg-gray-100 rounded-2xl py-4 px-4 flex flex-col items-center">
                <span class="text-gray-500 text-sm">收款方式</span>
                <span class="font-semibold text-gray-900 mt-1" id="paymentMethod">微信支付</span>
            </div>
            <button onclick="showPaymentOptions()" class="flex-1 bg-blue-500 text-white font-semibold py-4 rounded-2xl active:scale-95 transition-transform shadow-lg shadow-blue-500/30 flex items-center justify-center gap-2">
                <i class="fas fa-credit-card"></i>
                <span>收款 ¥12,397.00</span>
            </button>
        </div>
    </div>

    <!-- Payment Options Modal -->
    <div id="paymentModal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-end justify-center">
        <div class="bg-white w-full rounded-t-3xl p-6 pb-10 animate-slide-up">
            <div class="w-10 h-1 bg-gray-300 rounded-full mx-auto mb-6"></div>
            <h3 class="text-lg font-semibold text-gray-900 mb-4">选择支付方式</h3>
            <div class="space-y-3">
                <button onclick="selectPayment('微信支付')" class="w-full p-4 bg-green-50 border-2 border-green-500 rounded-2xl flex items-center gap-4">
                    <div class="w-12 h-12 bg-green-500 rounded-xl flex items-center justify-center">
                        <i class="fab fa-weixin text-white text-xl"></i>
                    </div>
                    <div class="flex-1 text-left">
                        <div class="font-semibold text-gray-900">微信支付</div>
                        <div class="text-gray-400 text-sm">推荐</div>
                    </div>
                    <i class="fas fa-check text-green-500"></i>
                </button>
                <button onclick="selectPayment('支付宝')" class="w-full p-4 bg-blue-50 border-2 border-transparent rounded-2xl flex items-center gap-4 active:bg-gray-50">
                    <div class="w-12 h-12 bg-blue-500 rounded-xl flex items-center justify-center">
                        <i class="fab fa-alipay text-white text-xl"></i>
                    </div>
                    <div class="flex-1 text-left">
                        <div class="font-semibold text-gray-900">支付宝</div>
                    </div>
                </button>
                <button onclick="selectPayment('现金')" class="w-full p-4 bg-gray-50 border-2 border-transparent rounded-2xl flex items-center gap-4 active:bg-gray-100">
                    <div class="w-12 h-12 bg-gray-500 rounded-xl flex items-center justify-center">
                        <i class="fas fa-money-bill-wave text-white text-xl"></i>
                    </div>
                    <div class="flex-1 text-left">
                        <div class="font-semibold text-gray-900">现金</div>
                    </div>
                </button>
                <button onclick="selectPayment('其他')" class="w-full p-4 bg-gray-50 border-2 border-transparent rounded-2xl flex items-center gap-4 active:bg-gray-100">
                    <div class="w-12 h-12 bg-gray-400 rounded-xl flex items-center justify-center">
                        <i class="fas fa-credit-card text-white text-xl"></i>
                    </div>
                    <div class="flex-1 text-left">
                        <div class="font-semibold text-gray-900">其他方式</div>
                    </div>
                </button>
            </div>
            <button onclick="closePaymentModal()" class="w-full mt-4 py-4 text-gray-500 font-medium">取消</button>
        </div>
    </div>

    <!-- Success Modal -->
    <div id="successModal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-6">
        <div class="bg-white w-full rounded-3xl p-8 text-center">
            <div class="w-20 h-20 bg-green-500 rounded-full flex items-center justify-center mx-auto mb-6">
                <i class="fas fa-check text-white text-3xl"></i>
            </div>
            <h2 class="text-2xl font-bold text-gray-900 mb-2">收款成功</h2>
            <p class="text-gray-500 mb-2">订单号：XS20260514001</p>
            <p class="text-3xl font-bold text-green-500 mb-6">¥12,397.00</p>
            <div class="flex gap-3">
                <button onclick="printReceipt()" class="flex-1 py-4 bg-gray-100 text-gray-700 font-semibold rounded-2xl active:scale-95 transition-transform">
                    <i class="fas fa-print mr-2"></i>打印小票
                </button>
                <button onclick="newOrder()" class="flex-1 py-4 bg-blue-500 text-white font-semibold rounded-2xl active:scale-95 transition-transform shadow-lg shadow-blue-500/30">
                    <i class="fas fa-plus mr-2"></i>新订单
                </button>
            </div>
        </div>
    </div>

    <script>
        function scanProduct() {
            alert('扫码功能 - 将打开相机扫描商品条码');
        }

        function searchProduct() {
            alert('搜索商品 - 将打开商品搜索页面');
        }

        function decreaseQty(btn) {
            const input = btn.parentElement.querySelector('input');
            const val = parseInt(input.value);
            if (val > 1) input.value = val - 1;
        }

        function increaseQty(btn) {
            const input = btn.parentElement.querySelector('input');
            input.value = parseInt(input.value) + 1;
        }

        function clearCart() {
            if (confirm('确定清空购物车？')) {
                alert('已清空购物车');
            }
        }

        function showPaymentOptions() {
            document.getElementById('paymentModal').classList.remove('hidden');
        }

        function closePaymentModal() {
            document.getElementById('paymentModal').classList.add('hidden');
        }

        function selectPayment(method) {
            document.getElementById('paymentMethod').textContent = method;
            closePaymentModal();

            // Simulate payment
            setTimeout(() => {
                document.getElementById('successModal').classList.remove('hidden');
            }, 500);
        }

        function printReceipt() {
            alert('打印小票中...');
        }

        function newOrder() {
            document.getElementById('successModal').classList.add('hidden');
            // Reset form
            alert('开始新订单');
        }
    </script>

    <style>
        .animate-slide-up {
            animation: slideUp 0.3s ease-out;
        }
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
    </style>
</body>
</html>
